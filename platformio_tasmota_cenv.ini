[env:tasmota32-sievju-esp32s3]
extends                 = env:tasmota32_base
;board                   = esp32s3
;board                   = esp32s3cdc-box
board                   = esp32s3-qio_qspi_120
; get the board file (~/.platformio/platforms/espressif32/boards/) from
; https://github.com/sivar2311/platformio_boards/blob/main/boards/esp32-s3-devkitc1-n16r8.json
;board                   = esp32-s3-devkitc1-n16r8
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_SIEVJU -DFIRMWARE_SIEVJU_ESP32S3
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl, lib/libesp32
lib_ignore              =
                          TTGO TWatch Library
                          Micro-RTSP
                          epdiy
upload_port             = /dev/ttyACM0

; *********************************************************************
[env:tasmota32s3-sievju-lvgl]
extends                 = env:tasmota32_base
;board                   = esp32s3
;board                   = esp32-s3-devkitc-1-n16r8v
;board                   = esp32-s3-devkitc1-n16r8
board                   = esp32s3-qio_qspi_120
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_SIEVJU -DFIRMWARE_SIEVJU_ESP32S3_LVGL
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl, lib/libesp32, lib/lib_display, lib/libesp32_lvgl, lib/lib_i2c
lib_ignore              =
                          TTGO TWatch Library
                          Micro-RTSP
                          epdiy
upload_port             = /dev/ttyACM0

; *********************************************************************
[env:tasmota32-sievju-contactor]
extends                 = env:tasmota32_base
board                   = esp32
;board                   = esp32_4M_FS
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_SIEVJU -DFIRMWARE_SIEVJU_ESP32_CONTACTOR
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl, lib/libesp32, lib/lib_i2c
lib_ignore              =
                          TTGO TWatch Library
                          Micro-RTSP
                          epdiy
upload_port             = /dev/ttyUSB1
;upload_speed            = 9600

; *********************************************************************
[env:tasmota32-sievju-vifter]
extends                 = env:tasmota32_base
board                   = esp32
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_SIEVJU -DFIRMWARE_SIEVJU_ESP32_VIFTER
lib_extra_dirs          = lib/lib_basic, lib/lib_ssl, lib/libesp32, lib/lib_i2c
lib_ignore              =
                          TTGO TWatch Library
                          Micro-RTSP
                          epdiy
upload_port             = /dev/ttyUSB0

