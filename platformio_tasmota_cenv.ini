; *********************************************************************
; platform core32itead is not standard in Tasmota. To use it an additional
; section [core32itead] with contents
;platform                    = https://github.com/tasmota/platform-espressif32/releases/download/v2.0.4.1/platform-espressif32-ITEAD-2.0.4.1.zip
; has to be included in platformio_tasmota32.ini.
; But probably tasmota32-sievju-nspanel would also build nowadays with
; the standard core32
;
;[env:tasmota32-sievju-nspanel]
;extends = env:tasmota32_base
;platform                = ${core32itead.platform}
;platform_packages       = ${core32itead.platform_packages}
;build_flags             = ${env:tasmota32_base.build_flags}
;                         -DFIRMWARE_SIEVJU -DFIRMWARE_SIEVJU_NSPANEL

; *********************************************************************a
; See comment on [env:tasmota32-sievju-nspanel]
